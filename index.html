<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Central de TI · Brandness</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="./">
        <img src="assets/img/logo.jpeg" alt="Brandness">
        <span>Central de TI</span>
      </a>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Seções"></nav>
    </div>
  </header>

  <main class="wrap">
    <img class="banner" src="assets/img/banner.jpeg" alt="Brandness – crafting brands with heart and brain">
    <section class="hero">
      <h1 id="title"></h1>
      <p id="intro"></p>
      <input class="search" id="search" type="search" aria-label="Buscar" autocomplete="off">
    </section>

    <div class="layout">
      <nav class="cats" id="cats" aria-label="Categorias"></nav>
      <section>
        <p class="count" id="count"></p>
        <div id="list"></div>
        <aside class="help" id="help"></aside>
      </section>
    </div>
  </main>

  <footer class="footer"><div class="wrap">Central de TI · Brandness · Mantido por [seu nome]</div></footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
